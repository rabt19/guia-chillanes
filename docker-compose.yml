# ============================================================================
# Guía Chillanes — orquestación de todos los servicios en contenedores.
#   docker compose up --build      -> levanta todo
#   docker compose down            -> apaga (los datos quedan en los volúmenes)
# Respaldo fácil: todo el estado vive en los volúmenes 'pgdata' y 'uploads'.
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ISSUER: ${TOTP_ISSUER}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: ${AUTH_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  negocios-service:
    build: ./services/negocios-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${NEGOCIOS_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  transporte-service:
    build: ./services/transporte-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${TRANSPORTE_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./services/gateway
    restart: unless-stopped
    environment:
      PORT: ${GATEWAY_PORT}
      AUTH_URL: http://auth-service:${AUTH_PORT}
      NEGOCIOS_URL: http://negocios-service:${NEGOCIOS_PORT}
      TRANSPORTE_URL: http://transporte-service:${TRANSPORTE_PORT}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - auth-service
      - negocios-service
      - transporte-service

volumes:
  pgdata:
